; Raises PHP's own upload limits above Filament/Livewire's default (which
; would otherwise accept this), since shared-hosting cPanel PHP typically
; ships with upload_max_filesize/post_max_size around 8M - well under a
; phone-camera photo's size (the "Phil.jpg" upload that failed was 11.7MB).
; Respected automatically on PHP-FPM/suPHP hosting (most cPanel shared
; hosting today); has no effect under mod_php, where the equivalent change
; is made via cPanel -> MultiPHP INI Editor instead.
upload_max_filesize = 32M
post_max_size = 36M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
